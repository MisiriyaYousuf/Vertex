{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">
    <style>
    .social-icons {
        display: flex !important;
        justify-content: center !important;
        gap: 15px !important;
        margin: 20px 0 !important;
    }

    .social-icons a {
        width: 30px !important;
        height: 30px !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        border: 1px solid #999 !important;
        border-radius: 50% !important;

        background: white !important;
        color: #777 !important;

        text-decoration: none !important;
        font-size: 13px !important;
    }

    .social-icons a i {
        color: #777 !important;
        font-size: 13px !important;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/signin.css' %}">
</head>
<body>

<div class="login-container">

    <div class="login-card">
       <div class="login-title">
            <h2>Login Here !</h2>
        </div>
        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}


            <div class="social-icons">

                <a href="{% provider_login_url 'google' %}" class="social-icon">
                    <i class="fa-brands fa-google"></i>
                </a>

            </div> 

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="eg: xyz@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            <div style="text-align: center; margin-top: 8px;">
           
            <a href="{% url 'users:forgot_password' %}" 
            onclick="window.location.replace(this.href); return false;"
            style="text-decoration: none; color:#0d6efd; font-weight:600;;">
                Forgot Password?
            </a>

            </div>
            <br>
            <button type="submit">Sign In</button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="{% url 'users:signup' %}">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
